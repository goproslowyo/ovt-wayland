name: build

# Rebuild weekly so the images track their bases, and on any change to the
# patches or the build files. The version guard in the builder turns a Fedora
# open-vm-tools rebase into a failed build here rather than a broken image on
# a VM.
#
# targets.json lists what gets built. The rpms job builds the RPMs for each
# Fedora release in it, the debs job the .debs for each Debian and Ubuntu
# target, and the arch job the Arch package. The images job layers the RPMs
# onto each image's base, and on main the release job attaches the published
# packages to a GitHub release.
on:
  push:
    branches: [main]
    # Documentation does not change the build, and an image build is 5 GB.
    paths-ignore:
      - '**.md'
      - LICENSE
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# A 5 GB image build per push adds up; supersede an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      rpms: ${{ steps.read.outputs.rpms }}
      debs: ${{ steps.read.outputs.debs }}
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # These values end up in shell commands, image references and artifact
      # names, so hold every one to a plain shape before anything uses it.
      - name: Read targets.json
        id: read
        run: |
          jq -e '
            (.rpms | length > 0) and
            all(.rpms[]; .fedora_release | type == "number") and
            (.debs | length > 0) and
            all(.debs[];
              (.name | test("^[a-z0-9][a-z0-9.-]*$")) and
              (.base | test("^[a-z0-9][a-z0-9./_-]*:[A-Za-z0-9._-]+$")) and
              (.distro_tag | test("^[a-z0-9.]*$"))) and
            ([.rpms[].fedora_release] as $rels |
             all(.images[];
               (.name | test("^[a-z0-9][a-z0-9-]*$")) and
               (.image | test("^[a-z0-9][a-z0-9._-]*$")) and
               (.containerfile | test("^images/[a-z0-9-]+/Containerfile$")) and
               (.base | test("^[a-z0-9][a-z0-9./_-]*(:[A-Za-z0-9._-]+)?$")) and
               (.tags | length > 0) and
               all(.tags[]; test("^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$")) and
               (.fedora_release as $r | $rels | index($r) != null)))
          ' targets.json
          {
            echo "rpms=$(jq -c .rpms targets.json)"
            echo "debs=$(jq -c .debs targets.json)"
            echo "images=$(jq -c .images targets.json)"
          } >> "$GITHUB_OUTPUT"

  rpms:
    name: rpms fc${{ matrix.fedora_release }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.rpms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        env:
          FEDORA_RELEASE: ${{ matrix.fedora_release }}
        run: |
          podman build -f builders/fedora-rpm/Containerfile \
            --build-arg FEDORA_RELEASE="$FEDORA_RELEASE" -o out .
          ls -l out/rpms
          for f in out/rpms/*.rpm; do
            case "$f" in
              *".fc$FEDORA_RELEASE.clipway."*) ;;
              *) echo "unexpected release in $f" >&2; exit 1 ;;
            esac
          done

      # Releases carry only the two packages the patches change and the
      # patched source rpm. The other subpackages are unchanged rebuilds;
      # anyone who needs them builds them from this repository.
      - name: Pick the packages to publish
        run: |
          mkdir out/publish
          cp out/rpms/open-vm-tools-[0-9]*.rpm \
             out/rpms/open-vm-tools-desktop-[0-9]*.rpm out/publish/
          ls -l out/publish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-rpm-fc${{ matrix.fedora_release }}
          path: out/publish/*.rpm
          if-no-files-found: error

  debs:
    name: debs ${{ matrix.name }}
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.debs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        env:
          BASE: ${{ matrix.base }}
          DISTRO_TAG: ${{ matrix.distro_tag }}
        run: |
          podman build -f builders/debian-deb/Containerfile \
            --build-arg BASE="$BASE" --build-arg DISTRO_TAG="$DISTRO_TAG" \
            --output type=local,dest=out .
          builders/debian-deb/install-test.sh "$BASE" out/debs
          # As for the RPMs, publish only the two packages the patches change.
          mkdir out/publish
          cp out/debs/open-vm-tools_*.deb out/debs/open-vm-tools-desktop_*.deb \
             out/publish/
          ls -l out/publish

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-deb-${{ matrix.name }}
          path: out/publish/*.deb
          if-no-files-found: error

  arch:
    needs: targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          mkdir -p out
          podman run --rm -v "$PWD":/src:ro,z -v "$PWD/out":/out:z \
            docker.io/library/archlinux:latest /src/packaging/arch/build.sh /out
          # Arch names the file with the epoch, 6:13.1.0-1. GitHub rewrites a
          # colon in an asset name, so drop the epoch here. pacman reads the
          # version from inside the package, not from the file name.
          for f in out/*.pkg.tar.zst; do
            test -e "$f" || { echo "no package in out/" >&2; exit 1; }
            n="$(basename "$f" | sed 's/-[0-9]\{1,\}:/-/')"
            [ "$n" = "$(basename "$f")" ] || mv "$f" "out/$n"
          done
          ls -l out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg-arch
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  images:
    name: image ${{ matrix.name }}
    needs: [targets, rpms]
    # An image needs only its own release's RPMs. Run even if another
    # release failed; the download below fails if this one's are missing.
    if: ${{ !cancelled() && needs.targets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.images) }}
    # A test copy of this repository sets the variable IMAGE_SUFFIX, for
    # example to -test, so it pushes to its own packages instead of the
    # published ones.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}${{ vars.IMAGE_SUFFIX }}
    steps:
      - name: Check the image name
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9-]+/[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "bad image name: $IMAGE" >&2
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The base image plus the image build does not fit in the default
      # runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg-rpm-fc${{ matrix.fedora_release }}
          path: rpms

      - name: Build
        # SIGNED_REPO must follow IMAGE. It names the repository the embedded
        # signature policy enforces, and a fork that left it at the default
        # would ship a policy pointing at someone else's images, so its own
        # would go unenforced.
        env:
          CONTAINERFILE: ${{ matrix.containerfile }}
          BASE_IMAGE: ${{ matrix.base }}
        run: |
          podman build -f "$CONTAINERFILE" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg SIGNED_REPO="$IMAGE" \
            --build-context rpms=rpms \
            -t "$IMAGE:latest" .

      # One login for every tool in this job. docker/login-action writes
      # ~/.docker/config.json, which podman falls back to when it finds no
      # auth file of its own, and which cosign reads directly. Logging in with
      # `podman login` instead would leave cosign unauthenticated, since the
      # two keep separate credential stores.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ join(matrix.tags, ' ') }}
        run: |
          # --digestfile reports the digest of the manifest as it landed in the
          # registry. The local digest from `podman image inspect` can differ,
          # because push can change the manifest. Signing the local one
          # produces a signature bootc will never find, while `cosign verify`
          # still passes against that same local digest.
          podman push --digestfile=/tmp/digest "$IMAGE:latest"
          for t in $TAGS "$(date -u +%Y%m%d)"; do
            [ "$t" = latest ] && continue
            podman tag "$IMAGE:latest" "$IMAGE:$t"
            podman push "$IMAGE:$t"
          done
          DIGEST="$(cat /tmp/digest)"
          # This value is expanded into later shells; keep it to the shape a
          # digest can actually have.
          # [[ =~ ]] anchors to the whole string; grep would anchor per line.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "refusing a digest that is not sha256:<64 hex>: $DIGEST" >&2
            exit 1
          }
          echo "pushed digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          # Cross-check against what the registry actually serves for the tag.
          skopeo inspect --format '{{.Digest}}' "docker://$IMAGE:latest" \
            | tee /tmp/remote-digest
          test "$DIGEST" = "$(cat /tmp/remote-digest)" || {
            echo "pushed digest does not match the tag in the registry" >&2
            exit 1
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5

      # bootc finds signatures through use-sigstore-attachments, which reads
      # the legacy referrers layout that cosign v2 writes by default. v3
      # writes a format it cannot find and refuses the flags that ask for the
      # old one, so pin v2 and stop the build on anything else.
      - name: Sign
        if: github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY" || {
            echo "SIGNING_SECRET is empty. It must be a *repository* secret;" >&2
            echo "an environment secret is not visible to this job." >&2
            exit 1
          }
          cosign version
          ver="$(cosign version 2>&1 |
                 sed -n 's/^GitVersion:[[:space:]]*v\{0,1\}//p' | head -1)"
          case "$ver" in
            2.*) ;;
            *)
              echo "cosign $ver installed; this signs with v2 only." >&2
              echo "Pin cosign-release above." >&2
              exit 1
              ;;
          esac
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            "$IMAGE@$DIGEST"

      # Fails the build if the signature is not where the bootc policy will
      # look for it, rather than letting that surface as a confusing
      # "signature was required" error on the next `bootc upgrade`.
      - name: Verify
        if: github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign verify --key cosign.pub "$IMAGE@$DIGEST"

      # A SLSA build provenance attestation, signed through Sigstore with this
      # workflow's GitHub identity, and stored next to the image. It names the
      # repository, commit and workflow run that built this digest, and
      # `gh attestation verify oci://IMAGE -R OWNER/REPO` checks it. The cosign
      # signature above stays the one bootc enforces.
      - name: Attest
        if: github.ref == 'refs/heads/main'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Publishes the packages the build jobs uploaded as one GitHub release, tagged
  # v<version>-<date>. It takes every artifact named pkg-*, so a new package
  # builder only has to upload its files under that prefix and be added to
  # needs below. A second run on the same day, or a re-run, replaces the
  # assets of that day's release instead of failing, and removes assets the
  # run did not build, so SHA256SUMS always covers the whole release. The tag
  # keeps pointing at the first commit of the day, and the notes name the
  # commit the assets were built from.
  #
  # Debian testing, sid and the newest Ubuntu move under the builds, so one
  # failed target must not hold back every other package. The release goes
  # out with what built, and the notes name the jobs that did not fully pass.
  release:
    needs: [rpms, debs, arch]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # One directory per artifact, so two builders that produce the same
      # file name fail the check below instead of overwriting each other.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pkg-*
          path: artifacts

      - name: Collect the packages
        run: |
          mkdir assets
          find artifacts -type f -print
          dups="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          test -z "$dups" || {
            echo "two artifacts have files with the same name:" >&2
            echo "$dups" >&2
            exit 1
          }
          # Asset names end up in shell commands and download URLs.
          find artifacts -type f -printf '%f\n' |
            grep -vE '^[A-Za-z0-9][A-Za-z0-9._+~-]*$' && {
              echo "refusing the file names above" >&2
              exit 1
            }
          # GitHub turns the ~ in Debian versions into a dot in asset
          # names. Rename first, so SHA256SUMS lists the names people
          # download.
          find artifacts -type f | while read -r f; do
            n="$(basename "$f" | tr '~' '.')"
            test ! -e "assets/$n" || { echo "duplicate asset $n" >&2; exit 1; }
            mv "$f" "assets/$n"
          done
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS assets/
          ls -l assets

      # Every release file, SHA256SUMS included, gets a build provenance
      # attestation. `gh attestation verify FILE -R OWNER/REPO` checks it.
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RPMS_RESULT: ${{ needs.rpms.result }}
          DEBS_RESULT: ${{ needs.debs.result }}
          ARCH_RESULT: ${{ needs.arch.result }}
        run: |
          cd assets
          ver="$(printf '%s\n' open-vm-tools-[0-9]*.x86_64.rpm |
                 sed -n 's/^open-vm-tools-\([0-9][0-9.]*\)-.*/\1/p' | sort -u)"
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "expected one open-vm-tools version, got: $ver" >&2
            exit 1
          }
          day="$(date -u +%Y%m%d)"
          tag="v$ver-$day"
          {
            echo "open-vm-tools $ver with the Wayland patches. Built from"
            echo "$GITHUB_SHA."
            echo
            echo "The README says which file to download and how to install it."
            [ "$RPMS_RESULT" = success ] ||
              printf '\nSome Fedora RPMs did not build in this run and are missing.\n'
            [ "$DEBS_RESULT" = success ] ||
              printf '\nSome Debian and Ubuntu .debs did not build in this run and are missing.\n'
            [ "$ARCH_RESULT" = success ] ||
              printf '\nThe Arch package did not build in this run and is missing.\n'
          } > ../notes
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload --clobber "$tag" ./*
            gh release view "$tag" --json assets --jq '.assets[].name' |
              while read -r a; do
                test -e "$a" || gh release delete-asset "$tag" "$a" --yes
              done
            gh release edit "$tag" --notes-file ../notes
          else
            gh release create "$tag" ./* \
              --target "$GITHUB_SHA" \
              --title "open-vm-tools $ver, $day" \
              --notes-file ../notes
          fi
